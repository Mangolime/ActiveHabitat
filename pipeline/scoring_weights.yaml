run:
  radius_m: 1250
  km: [5, 10, 15]
  default_km: 5
  # Масштаб насыщения: столько гектаров зелени в радиусе даёт фактор 0.63.
  # Пересчитан после того, как в слой добавились natural=wood и ООПТ — медиана
  # по городу выросла с 64 до 178 га, и на прежних 20 га фактор был бы единицей
  # у трёх четвертей гексов, то есть не различал бы районы вовсе.
  # На других длинах петли площадь круга растёт как r², поэтому park_ha0
  # масштабируем от калибровки на 5 км. Иначе на 15 км фактор снова слипнется.
  park_ha0: 150
  park_ha0_by_km: {5: 150, 10: 600, 15: 1350}
  amenity_sat: 8
  # В сумму гектаров в радиусе идёт любая зелень от 0.2 га — там она честно
  # складывается. А вот «ближайший парк» — это цель, куда бегун побежит, поэтому
  # порог выше: 10 га — это примерно 300x300 м, круг по периметру ~1.2 км.
  # На прежних 2 га у половины гексов ближайшим «парком» оказывался перелесок.
  park_area_min_ha: 0.2
  park_nearest_min_ha: 10.0
  # Пруд меньше 2 га — это лужа 140x140 м, вокруг неё не побегаешь. Полигоны
  # рек и каналов проходят мимо порога по тегу, их площадь ни о чём не говорит.
  # Русла меряем после склейки сегментов: в OSM медианный кусок — 337 м.
  water_min_ha: 2.0
  river_min_km: 1.0
  weights:
    park_area: 0.28
    park_water_access: 0.12
    run_friendly: 0.30
    high_stress_penalty: 0.22
    amenities: 0.08

bike:
  radius_m: 5000
  km: [10, 20, 30]
  default_km: 20
  # то же самое для велорадиуса: медиана выросла с 566 до 1265 га.
  # 15 км убрали: между часом и длинной покатушкой дыра слишком большая.
  park_ha0: 1000
  park_ha0_by_km: {10: 444, 20: 1778, 30: 4000}
  bike_infra_km0: 8
  bike_infra_km0_by_km: {10: 3.6, 20: 14.2, 30: 32}
  # Сколько разных направлений считать «полным набором». Подняли с 3 после того,
  # как направления начали определяться по названию маршрута: раньше их просто
  # недосчитывали (медиана 2), теперь медиана 3, а у центра доходит до 14.
  train_lines_cap: 6
  park_area_min_ha: 0.2
  # Велосипедист проезжает сквер насквозь за полминуты, целью он быть не может,
  # поэтому порог заметно выше бегового.
  park_nearest_min_ha: 25.0
  # Из чего складывается «зелёный» фактор велосипедиста; в сумме 1.0
  park_mix:
    area: 0.50
    park_dist: 0.25
    water_dist: 0.25
  shop_repair_sat: 3
  parking_sat: 8
  weights:
    bike_infra: 0.31
    low_stress: 0.20
    park_water: 0.12
    high_stress_penalty: 0.16
    trains: 0.13
    bike_shop_repair: 0.07
    bike_parking: 0.01
